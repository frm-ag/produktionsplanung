<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PRODUKTION.PLAN</title>
<meta name="theme-color" content="#2f6690">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f7;
    --panel:#ffffff;
    --panel-alt:#eef1f4;
    --accent:#2f6690;
    --accent-dim:#a9c3d4;
    --danger:#c0392b;
    --success:#2f9e5c;
    --warn:#b6650f;
    --warn-soft:#fbe9d6;
    --text:#1f2933;
    --text-muted:#69737d;
    --border:#dde2e7;
    --on-accent:#ffffff;
    --disp:'Space Grotesk',sans-serif;
    --mono:'IBM Plex Mono',monospace;
    --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;}

  /* ---------- Login ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:28px 26px;box-shadow:0 1px 2px rgba(30,42,50,.06),0 8px 30px rgba(30,42,50,.08);
  }
  .login-card h1{font-family:var(--disp);font-size:20px;margin:0 0 3px;}
  .login-card .sub{font-size:12.5px;color:var(--text-muted);margin-bottom:20px;}
  .login-card label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin:12px 0 4px;}
  .login-card input{
    width:100%;font:inherit;font-size:14px;padding:9px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);
  }
  .login-card .err{color:var(--danger);font-size:12.5px;min-height:16px;margin-top:10px;}
  .login-card button{
    width:100%;margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:7px;
    font:inherit;font-size:14px;font-weight:600;padding:10px;cursor:pointer;
  }
  .login-card button:disabled{opacity:.6;cursor:default;}

  /* ---------- App shell ---------- */
  #app{display:none;max-width:1400px;margin:0 auto;padding:16px 18px 60px;}
  .hazard-strip{height:5px;width:100%;background:repeating-linear-gradient(135deg, var(--accent) 0 10px, #1c3b52 10px 20px);}

  header{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    padding:14px 0 12px;border-bottom:1px solid var(--border);margin-bottom:16px;
    position:sticky;top:0;background:var(--bg);z-index:20;
  }
  .brand{margin-right:auto;}
  .brand h1{font-family:var(--disp);font-size:19px;font-weight:700;margin:0;letter-spacing:.3px;}
  .brand h1 span{color:var(--accent);}
  .brand .sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-muted);margin-right:5px;}
  .conn-dot.ok{background:var(--success);}
  .conn-dot.err{background:var(--danger);}

  .seg{display:inline-flex;background:var(--panel-alt);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px;}
  .seg button{border:none;background:transparent;color:var(--text-muted);font:inherit;font-size:13.5px;font-weight:600;padding:6px 13px;border-radius:5px;cursor:pointer;}
  .seg button.active{background:var(--panel);color:var(--text);}

  .nav-group{display:inline-flex;align-items:center;gap:8px;}
  .nav-group button.round{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;font-size:15px;}
  .nav-label{font-size:13.5px;font-weight:600;min-width:160px;text-align:center;}
  .today-btn{border:1px solid var(--border);background:var(--panel);color:var(--text-muted);font:inherit;font-size:12.5px;padding:6px 10px;border-radius:6px;cursor:pointer;}

  .filter-chips{display:inline-flex;gap:6px;}
  .filter-chips button{border:1px solid var(--border);background:var(--panel);color:var(--text-muted);font:inherit;font-size:12px;padding:5px 11px;border-radius:20px;cursor:pointer;}
  .filter-chips button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .add-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;font:inherit;font-size:13px;font-weight:600;padding:9px 15px;cursor:pointer;}
  .logout-btn{border:1px solid var(--border);background:var(--panel);color:var(--text-muted);font:inherit;font-size:12.5px;padding:6px 10px;border-radius:6px;cursor:pointer;}

  .layout{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start;}
  @media (max-width:980px){.layout{grid-template-columns:1fr;}}
  .cal-scroll{overflow-x:auto;padding-bottom:4px;}

  .week-grid{display:grid;grid-template-columns:repeat(5, minmax(206px, 1fr));gap:11px;min-width:840px;}
  .day-col{display:flex;flex-direction:column;gap:8px;}
  .day-head{padding:7px 3px 9px;border-bottom:2px solid var(--accent);}
  .day-head.is-today{border-bottom-color:var(--warn);}
  .day-name{font-family:var(--disp);font-weight:700;font-size:13.5px;}
  .day-date{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
  .day-body{display:flex;flex-direction:column;gap:8px;min-height:60px;}
  .day-empty{font-size:11.5px;color:#a9b2b8;padding:8px 2px;}
  .day-add{border:1px dashed var(--border);background:transparent;color:#a9b2b8;border-radius:6px;font:inherit;font-size:11.5px;padding:6px;cursor:pointer;}
  .day-add:hover{color:var(--text-muted);}

  .order-card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:2px;padding:9px 10px;cursor:pointer;}
  .order-card.wk-aluminium{border-left-color:#8b96a0;}
  .order-card.wk-reparaturen{border-left-color:#8e6b1f;}
  .order-card.mat-pending{border-style:dashed;border-color:var(--warn);}
  .order-top{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .order-no{font-family:var(--mono);font-size:11.5px;font-weight:600;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.ok{background:var(--success);}
  .dot.warn{background:var(--warn);}
  .dot.neutral{background:#c3ccd1;}
  .order-customer{font-size:13px;font-weight:600;margin-top:3px;}
  .order-desc{font-size:11.5px;color:var(--text-muted);margin-top:2px;line-height:1.35;}
  .order-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;background:var(--accent-dim);color:#1c3b52;}
  .tag.tag-aluminium{background:#e4e8ea;color:#4b5a63;}
  .tag.tag-reparaturen{background:#f4e9d3;color:#8e6b1f;}
  .tag.tag-montage{background:#efe6f5;color:#7b4fa0;font-weight:700;}
  .tag.tag-werkstatt{background:#e3ebf3;color:var(--accent);font-weight:700;}
  .tag.tag-ready{background:#e3f2e9;color:var(--success);}
  .tag.tag-notready{background:var(--warn-soft);color:var(--warn);}
  .material-lines{margin-top:6px;display:flex;flex-direction:column;gap:3px;}
  .material-line{font-size:10.5px;color:var(--text-muted);display:flex;align-items:center;gap:5px;}
  .material-line .mdot{width:6px;height:6px;border-radius:50%;flex:none;}
  .material-line .mdot.ok{background:var(--success);}
  .material-line .mdot.warn{background:var(--warn);}
  .material-line.warn-text{color:var(--warn);font-weight:600;}
  .montage-only{opacity:.92;border-left-color:#7b4fa0 !important;}
  .phase-montage{border-left-color:#7b4fa0 !important;}
  .montage-only .order-top .order-no::before{content:"Montage · ";font-weight:500;color:#a9b2b8;}

  .month-grid{display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:8px;overflow:hidden;min-width:740px;}
  .month-weekday{background:var(--panel-alt);font-size:11px;font-weight:600;color:var(--text-muted);padding:6px 7px;}
  .month-cell{background:var(--panel);min-height:104px;padding:6px 6px 4px;display:flex;flex-direction:column;}
  .month-cell.out{background:var(--panel-alt);}
  .month-cell.is-today .month-daynum{color:var(--warn);}
  .month-daynum{font-size:11.5px;font-weight:700;color:var(--text-muted);padding:2px 2px 4px;cursor:pointer;}
  .out .month-daynum{color:#c3ccd1;}
  .month-chips{display:flex;flex-direction:column;gap:3px;overflow-y:auto;max-height:74px;flex:1;cursor:pointer;}
  .chip{font-size:10px;padding:2px 6px;border-radius:4px;border-left:3px solid var(--accent);background:var(--accent-dim);color:#1c3b52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .chip.aluminium{border-left-color:#8b96a0;background:#e4e8ea;color:#4b5a63;}
  .chip.reparaturen{border-left-color:#8e6b1f;background:#f4e9d3;color:#8e6b1f;}
  .chip.montage-chip{border-left-style:solid;background:#efe6f5;border-left-color:#7b4fa0;color:#7b4fa0;}
  .chip.pending{outline:1px dashed var(--warn);outline-offset:-1px;}

  .sidebar{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:14px;position:sticky;top:78px;}
  .sidebar h2{font-family:var(--disp);font-size:13px;margin:0 0 3px;}
  .sidebar-h2-second{margin-top:18px !important;padding-top:14px;border-top:1px solid var(--border);}
  .ready-item{border:1px solid var(--accent);background:#eaf1f6;border-radius:7px;padding:8px 9px;margin-bottom:8px;cursor:pointer;}
  .ready-item .order-no{color:var(--accent);}
  .ready-item .order-customer{font-size:12px;margin-top:2px;}
  .ready-item .ready-since{font-size:10.5px;color:var(--accent);margin-top:4px;font-weight:600;}
  .ready-item .ready-desc{font-size:10.5px;color:var(--text-muted);margin-top:2px;}
  .card-done-toggle{width:15px;height:15px;flex:none;accent-color:var(--success);cursor:pointer;}
  .order-card.completed{opacity:.55;}
  .order-card.completed .order-customer,.order-card.completed .order-desc{text-decoration:line-through;}
  .sidebar .count{font-size:11.5px;color:var(--text-muted);margin-bottom:10px;}
  .pending-item{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:7px;padding:8px 9px;margin-bottom:8px;cursor:pointer;}
  .pending-item .order-no{color:var(--warn);}
  .pending-item .order-customer{font-size:12px;margin-top:2px;}
  .pending-item .plan-hint{font-size:10.5px;color:var(--text-muted);margin-top:4px;}
  .pending-item .mat-detail{font-size:10.5px;color:var(--warn);margin-top:3px;}
  .empty-note{font-size:12px;color:var(--text-muted);padding:6px 2px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,25,28,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--panel);border-radius:10px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:20px 22px 18px;}
  .modal h3{font-family:var(--disp);margin:0 0 14px;font-size:16px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);margin-bottom:4px;}
  .field input,.field select{width:100%;font:inherit;font-size:13.5px;padding:8px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:480px){ .field-row{grid-template-columns:1fr;} }
  .modal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px;}
  .btn{font:inherit;font-size:13px;font-weight:600;padding:8px 15px;border-radius:7px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);}

  .materials-box{border:1px solid var(--border);border-radius:7px;padding:8px;background:var(--panel-alt);}
  .material-row{display:grid;grid-template-columns:1fr 100px 122px 30px 26px;gap:6px;margin-bottom:6px;align-items:center;}
  .material-row input,.material-row select{font:inherit;font-size:12px;padding:6px 7px;border-radius:5px;border:1px solid var(--border);background:var(--panel);color:var(--text);}
  .material-row .mat-remove{border:none;background:transparent;color:#a9b2b8;cursor:pointer;font-size:15px;width:26px;height:26px;border-radius:5px;}
  .material-row .mat-remove:hover{color:var(--danger);}
  .material-row .mat-pdf-btn{border:1px solid var(--border);background:var(--panel);color:var(--text-muted);cursor:pointer;font-size:13px;width:30px;height:28px;border-radius:5px;}
  .material-row .mat-pdf-btn:hover{border-color:var(--accent);color:var(--accent);}
  .material-row .mat-pdf-btn.busy{opacity:.5;pointer-events:none;}
  .mat-date-wrap .mat-date-display{width:100%;}
  .mat-date-wrap{display:block;}
  @media (max-width:560px){
    .material-row{
      grid-template-columns:1fr 1fr 30px;
      grid-template-areas:"name name remove" "status date pdf";
      row-gap:6px;
    }
    .material-row .mat-name{grid-area:name;}
    .material-row .mat-remove{grid-area:remove;justify-self:end;}
    .material-row .mat-status{grid-area:status;width:100%;}
    .material-row .mat-date-wrap{grid-area:date;width:100%;}
    .material-row .mat-pdf-btn{grid-area:pdf;justify-self:end;}
  }
  .add-material-btn{border:1px dashed var(--border);background:transparent;color:var(--text-muted);font:inherit;font-size:11.5px;padding:6px 10px;border-radius:6px;cursor:pointer;width:100%;}
  .todos-box{border:1px solid var(--border);border-radius:7px;padding:8px;background:var(--panel-alt);}
  .todo-row{display:grid;grid-template-columns:20px 1fr 108px 26px;gap:6px;margin-bottom:6px;align-items:center;}
  .todo-row input[type="checkbox"]{width:16px;height:16px;flex:none;accent-color:var(--accent);}
  .todo-row input[type="text"]{width:100%;font:inherit;font-size:12.5px;padding:6px 7px;border-radius:5px;border:1px solid var(--border);background:var(--panel);color:var(--text);}
  .todo-row input[type="text"].done{color:var(--text-muted);text-decoration:line-through;}
  .todo-date-wrap{display:block;}
  .todo-date-wrap .todo-date-display{width:100%;font-size:12px;padding:6px 7px;border-radius:5px;border:1px solid var(--border);background:var(--panel);color:var(--text);}
  .todo-row .todo-remove{border:none;background:transparent;color:#a9b2b8;cursor:pointer;font-size:15px;width:26px;height:26px;border-radius:5px;flex:none;}
  .todo-row .todo-remove:hover{color:var(--danger);}
  @media (max-width:560px){
    .todo-row{
      grid-template-columns:20px 1fr 26px;
      grid-template-areas:"check text remove" "date date date";
      row-gap:6px;
    }
    .todo-row input[type="checkbox"]{grid-area:check;}
    .todo-row input[type="text"]{grid-area:text;}
    .todo-row .todo-remove{grid-area:remove;}
    .todo-row .todo-date-wrap{grid-area:date;width:100%;}
  }
  .add-todo-btn{border:1px dashed var(--border);background:transparent;color:var(--text-muted);font:inherit;font-size:11.5px;padding:6px 10px;border-radius:6px;cursor:pointer;width:100%;}
  .todos-empty{font-size:11.5px;color:#a9b2b8;padding:4px 2px 8px;}
  .todo-progress{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;background:var(--panel-alt);color:var(--text-muted);border:1px solid var(--border);}
  .todo-progress.done-all{background:var(--ok-soft, #e3f2e9);color:var(--success);border-color:var(--success);}
  .card-todo-lines{margin-top:6px;display:flex;flex-direction:column;gap:2px;}
  .card-todo-line{font-size:10.5px;color:var(--text-muted);display:flex;align-items:center;gap:5px;cursor:pointer;padding:1px 3px;margin:0 -3px;border-radius:3px;}
  .card-todo-line:hover{background:var(--panel-alt);}
  .card-todo-line.done{text-decoration:line-through;color:#c3ccd1;}
  .card-todo-line.overdue{color:var(--danger);font-weight:600;}
  .todo-due{color:inherit;}
  .materials-empty{font-size:11.5px;color:#a9b2b8;padding:4px 2px 8px;}

  .date-field{position:relative;display:block;}
  .date-input{width:100%;cursor:pointer;background:var(--panel);}
  #calendar-popup{position:fixed;z-index:500;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:10px;display:none;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow-y:auto;}
  .cal-pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-family:var(--disp);font-weight:700;font-size:13px;}
  .cal-pop-head button{border:none;background:var(--panel-alt);width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:14px;color:var(--text);}
  .cal-pop-grid{display:grid;grid-template-columns:26px repeat(7,1fr);gap:2px;}
  .cal-pop-grid .cal-wk{font-size:9.5px;color:#a9b2b8;display:flex;align-items:center;justify-content:center;}
  .cal-pop-grid .cal-dh{font-size:10px;color:var(--text-muted);text-align:center;font-weight:600;padding-bottom:3px;}
  .cal-pop-grid button.cal-day{border:none;background:transparent;font-size:11.5px;padding:5px 0;border-radius:5px;cursor:pointer;color:var(--text);}
  .cal-pop-grid button.cal-day.out{color:#c3ccd1;}
  .cal-pop-grid button.cal-day.today{box-shadow:inset 0 0 0 1px var(--accent);}
  .cal-pop-grid button.cal-day.selected{background:var(--accent);color:#fff;}
  .cal-pop-foot{display:flex;justify-content:space-between;margin-top:8px;border-top:1px solid var(--border);padding-top:7px;}
  .cal-pop-foot button{border:none;background:transparent;color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;}
  footer.status{text-align:center;font-size:11px;color:#a9b2b8;margin-top:24px;}
  #todos-page{max-width:640px;margin:0 auto;}
  .gt-form{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .gt-form #gt-text{flex:1;min-width:180px;font:inherit;font-size:13.5px;padding:9px 10px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);}
  .gt-date-field{width:150px;}
  .gt-date-field .date-input{padding:9px 10px;font-size:13px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--text);}
  .gt-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px;}
  .gt-item input[type="checkbox"]{width:17px;height:17px;flex:none;accent-color:var(--accent);cursor:pointer;}
  .gt-item .gt-text{flex:1;font-size:13.5px;}
  .gt-item.done .gt-text{color:var(--text-muted);text-decoration:line-through;}
  .gt-item .gt-due{font-size:11px;color:var(--text-muted);white-space:nowrap;}
  .gt-item.overdue .gt-due{color:var(--danger);font-weight:700;}
  .gt-item .gt-remove{border:none;background:transparent;color:#a9b2b8;cursor:pointer;font-size:16px;width:26px;height:26px;border-radius:5px;flex:none;}
  .gt-item .gt-remove:hover{color:var(--danger);}
  .gt-empty{text-align:center;color:var(--text-muted);font-size:13px;padding:30px 10px;}
  #table-page{max-width:1400px;margin:0 auto;}
  .table-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .table-toolbar #table-search{flex:1;min-width:180px;font:inherit;font-size:13px;padding:8px 11px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);}
  .ready-filter-btn{border:1px solid var(--border);background:var(--panel);color:var(--text-muted);font:inherit;font-size:12px;padding:7px 13px;border-radius:20px;cursor:pointer;white-space:nowrap;}
  .ready-filter-btn.active{background:var(--success);border-color:var(--success);color:#fff;}
  .table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:9px;background:var(--panel);}
  .overview-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:960px;}
  .overview-table thead th{
    position:sticky;top:0;background:var(--panel-alt);text-align:left;font-size:11px;font-weight:700;

/* ---------- App state & helpers ---------- */

var state = { orders: [], generalTodos: [], view: "table", filter: "alle", refDate: toISO(new Date()), editingId: null, modalMaterials: [], modalTodos: [], tableSort: { field: "orderNumber", dir: "asc" }, tableSearch: "", readyFilter: { readyWerkstatt: false, readyMontage: false } };

function toISO(d){ var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function fromISO(iso){ return new Date(iso + "T00:00:00"); }
function todayISO(){ return toISO(new Date()); }
function fmtDay(d){ return d.toLocaleDateString("de-CH", { weekday: "long" }); }
function fmtDate(d){ return d.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" }); }
function fmtShort(iso){ if(!iso) return ""; var d=fromISO(iso); return d.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit" }); }
function isoToDisplay(iso){ if(!iso) return ""; var d=fromISO(iso); return d.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" }); }
function isoWeek(iso){
  if(!iso) return null;
  var d = fromISO(iso);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7));
  var week1 = new Date(d.getFullYear(),0,4);
  return 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay()+6)%7)) / 7);
}
function updateWeekHint(inputId, hintId){
  var val = $(inputId).value;
  $(hintId).textContent = val ? "KW " + isoWeek(val) : "";
}
function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* ---------- PDF-Liefertermin-Erkennung (läuft komplett im Browser, via pdf.js) ---------- */

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

var pdfWorkerReady = (async function(){
  // Manche Browser blockieren das direkte Laden eines "Workers" von einer fremden Adresse (CDN).
  // Als Absicherung wird das Worker-Skript stattdessen geladen und als lokale Kopie bereitgestellt.
  try{
    var resp = await fetch(pdfjsLib.GlobalWorkerOptions.workerSrc);
    var code = await resp.text();
    var blob = new Blob([code], { type: "text/javascript" });
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
  }catch(e){ /* Fallback: Original-CDN-Adresse bleibt bestehen */ }
})();

async function getPdfPagesData(file){
  await pdfWorkerReady;
  var buf = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  var fullText = "";
  var pagesLines = [];
  for(var i=1; i<=pdf.numPages; i++){
    var page = await pdf.getPage(i);
    var content = await page.getTextContent();
    var items = content.items.map(it=>({ str: it.str, x: it.transform[4], y: it.transform[5] }));
    fullText += items.map(it=>it.str).join(" ") + "\n";
    pagesLines.push(buildTextLines(items));
  }
  return { fullText: fullText, pagesLines: pagesLines };
}

// Gruppiert Textbausteine anhand ihrer Y-Position zu Zeilen (für Tabellen-Layouts).
function buildTextLines(items){
  var sorted = items.slice().sort((a,b)=> b.y - a.y);
  var lines = [];
  var current = null;
  sorted.forEach(it=>{
    if(current && Math.abs(it.y - current.y) < 3) current.items.push(it);
    else { current = { y: it.y, items: [it] }; lines.push(current); }
  });
  lines.forEach(line=> line.items.sort((a,b)=> a.x - b.x));
  return lines;
}

var GERMAN_MONTHS = {
  "januar":"01","jan":"01",
  "februar":"02","feb":"02",
  "märz":"03","maerz":"03","mrz":"03","mär":"03",
  "april":"04","apr":"04",
  "mai":"05",
  "juni":"06","jun":"06",
  "juli":"07","jul":"07",
  "august":"08","aug":"08",
  "september":"09","sep":"09","sept":"09",
  "oktober":"10","okt":"10",
  "november":"11","nov":"11",
  "dezember":"12","dez":"12"
};

// Erkennt Datumsangaben in vielen gängigen Schreibweisen:
// 29.10.2026 / 29.10.26 / 29/10/2026 / 29-10-2026 / 2026-10-29 / 29. September 2026 / 29. Sep 2026
function germanDateToIso(text){
  var mIso = text.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
  if(mIso) return mIso[1] + "-" + mIso[2].padStart(2,"0") + "-" + mIso[3].padStart(2,"0");
  var m = text.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{2,4})/);
  if(m){
    var day = m[1].padStart(2,"0"), month = m[2].padStart(2,"0");
    var year = m[3].length === 2 ? "20" + m[3] : m[3];
    return year + "-" + month + "-" + day;
  }
  var m2 = text.match(/(\d{1,2})\.?\s+([A-Za-zÄÖÜäöüß]+)\.?\s+(\d{4})/);
  if(m2){
    var monthNum = GERMAN_MONTHS[m2[2].toLowerCase().replace(/\.$/,"")];
    if(monthNum) return m2[3] + "-" + monthNum + "-" + m2[1].padStart(2,"0");
  }
  return null;
}

function toIsoDate(d){ var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function isoWeekMonday(week, year){
  var jan4 = new Date(year,0,4);
  var jan4Day = (jan4.getDay()+6)%7;
  var week1Monday = new Date(jan4); week1Monday.setDate(jan4.getDate()-jan4Day);
  var target = new Date(week1Monday); target.setDate(week1Monday.getDate() + (week-1)*7);
  return target;
}
// Erkennt Kalenderwochen-Angaben in verschiedensten Schreibweisen:
// "KW 43", "KW43/2026", "36 / 2026", "Jahr: 2026 - Woche: 42", "Woche: 42, Jahr 2026" — liefert den Montag dieser Woche.
function kwToIso(text){
  var week=null, year=null, m;
  if(m = text.match(/KW\.?\s*(\d{1,2})\s*[\/\.]\s*(\d{2,4})/i)){
    week = parseInt(m[1],10); year = parseInt(m[2].length===2 ? "20"+m[2] : m[2], 10);
  } else if(m = text.match(/Jahr:?\s*(\d{4})\D{0,20}?Woche:?\s*(\d{1,2})/i)){
    year = parseInt(m[1],10); week = parseInt(m[2],10);
  } else if(m = text.match(/Woche:?\s*(\d{1,2})\D{0,20}?Jahr:?\s*(\d{4})/i)){
    week = parseInt(m[1],10); year = parseInt(m[2],10);
  } else if(m = text.match(/(\d{1,2})\s*\/\s*(\d{4})/)){
    week = parseInt(m[1],10); year = parseInt(m[2],10);
  } else if(m = text.match(/KW\.?\s*(\d{1,2})\b/i)){
    week = parseInt(m[1],10);
  } else {
    return null;
  }
  if(!week || week<1 || week>53) return null;
  var hadYear = !!year;
  if(!year) year = (new Date()).getFullYear();
  var monday = isoWeekMonday(week, year);
  if(!hadYear){
    var cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-21);
    if(monday < cutoff) monday = isoWeekMonday(week, year+1);
  }
  return toIsoDate(monday);
}
// Erst exaktes Datum versuchen, sonst Kalenderwoche (als Montag-Näherung, mit Hinweis).
function parseDeliveryDate(text){
  var iso = germanDateToIso(text);
  if(iso) return { iso: iso, approx: false };
  var kw = kwToIso(text);
  if(kw) return { iso: kw, approx: true };
  return null;
}

var LIEFER_LABELS = [
  "Liefertermin", "voraussichtlicher Liefertermin", "Lieferdatum", "Liefertag", "Lieferwoche",
  "Versanddatum", "Versandtermin", "Versandtag",
  "Abholdatum", "Abholtermin",
  "Auslieferungstermin", "Auslieferungsdatum",
  "Zustelldatum", "Zustelltermin",
  "Ablieferungstermin", "Ablieferdatum", "Ablieferungsdatum",
  "Bereitstellungstermin", "Bereitstellungsdatum",
  "Wunschtermin", "Wunschlieferdatum",
  "Anliefertermin", "Anlieferdatum",
  "Fertigstellungstermin",
  "Endtermin", "Bestätigter Endtermin", "Bestätigungstermin", "Bestätigter Termin", "Bestät. Termin", "Bestätigte Lieferung"
];

// Variante 1: Label und Datum stehen direkt nebeneinander im Fliesstext (z.B. "Liefertermin: 29.10.2026").
function findLieferdatum(text){
  for(var i=0; i<LIEFER_LABELS.length; i++){
    var idx = text.toLowerCase().indexOf(LIEFER_LABELS[i].toLowerCase());
    if(idx === -1) continue;
    var result = parseDeliveryDate(text.slice(idx, idx + 120));
    if(result) return result;
  }
  return null;
}

// Variante 2: Tabellen-Layout — Spaltenkopf "Lieferdatum" oben, Wert in derselben Spalte eine Zeile weiter unten.
function findLieferdatumInTable(pagesLines){
  var labelWordsNormalized = LIEFER_LABELS.map(l=>l.toLowerCase());
  for(var p=0; p<pagesLines.length; p++){
    var lines = pagesLines[p];
    for(var li=0; li<lines.length; li++){
      var line = lines[li];
      for(var ii=0; ii<line.items.length; ii++){
        var raw = line.items[ii].str.toLowerCase().replace(/[:.,]/g,"").trim();
        if(labelWordsNormalized.indexOf(raw) === -1) continue;
        var x0 = line.items[ii].x;
        var x1 = null;
        for(var jj=ii+1; jj<line.items.length; jj++){
          if(line.items[jj].x > x0 + 5){ x1 = line.items[jj].x; break; }
        }
        var colLeft = x0 - 20, colRight = (x1!==null ? x1 : x0 + 160) + 40;
        for(var vi=li+1; vi<Math.min(li+4, lines.length); vi++){
          var snippetItems = lines[vi].items.filter(it=> it.x >= colLeft && it.x <= colRight);
          if(snippetItems.length===0) continue;
          var result = parseDeliveryDate(snippetItems.map(it=>it.str).join(" "));
          if(result) return result;
        }
      }
    }
  }
  return null;
}

async function extractLieferdatumFromPdf(file){
  var data = await getPdfPagesData(file);
  return findLieferdatum(data.fullText) || findLieferdatumInTable(data.pagesLines);
}

function getWeekDays(refISO){
  var d=fromISO(refISO), day=d.getDay(), diff = day===0?-6:1-day;
  var monday=new Date(d); monday.setDate(d.getDate()+diff);
  var days=[]; for(var i=0;i<5;i++){ var dt=new Date(monday); dt.setDate(monday.getDate()+i); days.push(dt); }
  return days;
}
function getMonthGrid(refISO){
  var d=fromISO(refISO), year=d.getFullYear(), month=d.getMonth();
  var firstOfMonth=new Date(year,month,1), startDay=firstOfMonth.getDay(), diff = startDay===0?-6:1-startDay;
  var gridStart=new Date(firstOfMonth); gridStart.setDate(firstOfMonth.getDate()+diff);
  var days=[]; for(var i=0;i<42;i++){ var dt=new Date(gridStart); dt.setDate(gridStart.getDate()+i); days.push(dt); }
  return { days: days, month: month };
}
function filteredOrders(){ return state.filter==="alle" ? state.orders : state.orders.filter(o=>o.workshop===state.filter); }
function ordersStartingOn(iso){ return filteredOrders().filter(o=>o.productionStart===iso); }
function ordersAssemblyOn(iso){ return filteredOrders().filter(o=>o.assemblyDate===iso && o.assemblyDate!==o.productionStart); }
function orderMaterials(o){ return Array.isArray(o.materials) ? o.materials : []; }
function orderTodos(o){ return Array.isArray(o.todos) ? o.todos : []; }
function todoProgress(o){
  var todos = orderTodos(o);
  var done = todos.filter(t=>t.done).length;
  return { done: done, total: todos.length };
}
function hasPendingMaterial(o){ return orderMaterials(o).some(m=>m.status==="ausstehend"); }
function pendingMaterials(o){ return orderMaterials(o).filter(m=>m.status==="ausstehend"); }
function isReadyNotDone(o){ return (!!o.readyWerkstatt || !!o.readyMontage) && !o.completed; }
function daysWaiting(o){ return Math.round((fromISO(todayISO()) - fromISO(o.productionStart)) / 86400000); }

function workshopLabel(w){ return w==="aluminium" ? "Aluminium" : (w==="reparaturen" ? "Reparaturen" : "Stahl"); }
function orderCardHTML(o, isMontageOnly){
  var wsClass = o.workshop==="aluminium" ? "wk-aluminium" : (o.workshop==="reparaturen" ? "wk-reparaturen" : "");
  var pending = hasPendingMaterial(o);
  var mats = orderMaterials(o);
  var dotClass = mats.length===0 ? "neutral" : (pending ? "warn" : "ok");
  var tagClass = o.workshop==="aluminium" ? "tag-aluminium" : (o.workshop==="reparaturen" ? "tag-reparaturen" : "");
  var phase = isMontageOnly ? "montage" : "werkstatt";
  var phaseReady = phase==="montage" ? !!o.readyMontage : !!o.readyWerkstatt;
  var tags = '<span class="tag ' + (phase==="montage" ? "tag-montage" : "tag-werkstatt") + '">' + (phase==="montage" ? "Montage" : "Werkstatt") + '</span>';
  tags += '<span class="tag ' + (phaseReady?"tag-ready":"tag-notready") + '">' + (phaseReady?"Bereit":"Nicht bereit") + '</span>';
  tags += '<span class="tag ' + tagClass + '">' + workshopLabel(o.workshop) + "</span>";
  if(!isMontageOnly && o.assemblyDate) tags += '<span class="tag tag-montage">Montage ' + fmtShort(o.assemblyDate) + "</span>";
  var prog = todoProgress(o);
  if(prog.total > 0) tags += '<span class="todo-progress' + (prog.done===prog.total?" done-all":"") + '">☑ ' + prog.done + '/' + prog.total + '</span>';
  var matLines = "";
  mats.forEach(m=>{
    var isOk = m.status==="geliefert";
    var line = isOk ? "geliefert" : (m.expectedDate ? "ab " + fmtShort(m.expectedDate) : "ausstehend");
    matLines += '<div class="material-line' + (isOk?"":" warn-text") + '"><span class="mdot ' + (isOk?"ok":"warn") + '"></span>' + escapeHtml(m.name) + " · " + line + "</div>";
  });
  var todoLines = "";
  orderTodos(o).forEach((t,i)=>{
    todoLines += '<div class="card-todo-line' + (t.done?" done":"") + ((!t.done && t.dueDate && t.dueDate < todayISO())?" overdue":"") + '" data-order-id="' + o.id + '" data-todo-idx="' + i + '">' + (t.done?"☑":"☐") + " " + escapeHtml(t.text) + (t.dueDate ? ' <span class="todo-due">· bis ' + fmtShort(t.dueDate) + '</span>' : "") + "</div>";
  });
  return '<div class="order-card ' + wsClass + " " + (pending?"mat-pending":"") + (isMontageOnly?" montage-only":"") + (phase==="montage"?" phase-montage":"") + (o.completed?" completed":"") + '" data-id="' + o.id + '">' +
    '<div class="order-top"><span class="order-no">' + escapeHtml(o.orderNumber) + '</span>' + (isMontageOnly ? '<span class="dot ' + dotClass + '"></span>' : '<input type="checkbox" class="card-done-toggle" data-id="' + o.id + '"' + (o.completed?" checked":"") + '>') + '</div>' +
    '<div class="order-customer">' + escapeHtml(o.customer) + '</div>' +
    (o.description ? '<div class="order-desc">' + escapeHtml(o.description) + '</div>' : "") +
    '<div class="order-tags">' + tags + '</div>' +
    (matLines ? '<div class="material-lines">' + matLines + '</div>' : "") +
    (todoLines ? '<div class="card-todo-lines">' + todoLines + '</div>' : "") +
    '</div>';
}
function renderWeek(){
  var days = getWeekDays(state.refDate);
  var html = '<div class="week-grid">';
  days.forEach(d=>{
    var iso=toISO(d), starting=ordersStartingOn(iso), montage=ordersAssemblyOn(iso), isToday=iso===todayISO();
    html += '<div class="day-col"><div class="day-head' + (isToday?" is-today":"") + '"><div class="day-name">' + fmtDay(d) + '</div><div class="day-date">' + fmtDate(d) + '</div></div><div class="day-body">';
    if(starting.length===0 && montage.length===0) html += '<div class="day-empty">Keine Aufträge</div>';
    else{ starting.forEach(o=>html+=orderCardHTML(o,false)); montage.forEach(o=>html+=orderCardHTML(o,true)); }
    html += '<button class="day-add" data-date="' + iso + '">+ Auftrag hier</button></div></div>';
  });
  html += "</div>";
  $("#calendar").innerHTML = html;
}
function renderMonth(){
  var grid = getMonthGrid(state.refDate);
  var weekdayNames = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  var html = '<div class="month-grid">';
  weekdayNames.forEach(n=>html += '<div class="month-weekday">' + n + "</div>");
  grid.days.forEach(d=>{
    var iso=toISO(d), out=d.getMonth()!==grid.month, isToday=iso===todayISO();
    var starting=ordersStartingOn(iso), montage=ordersAssemblyOn(iso);
    html += '<div class="month-cell' + (out?" out":"") + (isToday?" is-today":"") + '"><div class="month-daynum" data-add-date="' + iso + '">' + d.getDate() + '</div><div class="month-chips">';
    starting.forEach(o=>{
      var cls = (o.workshop==="aluminium"?"aluminium":(o.workshop==="reparaturen"?"reparaturen":"")) + (hasPendingMaterial(o)?" pending":"");
      html += '<div class="chip ' + cls + '" data-id="' + o.id + '">' + escapeHtml(o.orderNumber) + " · " + escapeHtml(o.customer) + "</div>";
    });
    montage.forEach(o=>html += '<div class="chip montage-chip" data-id="' + o.id + '">▲ ' + escapeHtml(o.orderNumber) + "</div>");
    html += "</div></div>";
  });
  html += "</div>";
  $("#calendar").innerHTML = html;
}
function renderGeneralTodos(){
  var list = $("#general-todos-list");
  var todos = state.generalTodos.slice().sort((a,b)=>{
    if(!!a.done !== !!b.done) return a.done ? 1 : -1;

function renderTable(){
  var rows = filteredOrders().slice();
  var search = state.tableSearch.trim().toLowerCase();
  if(search) rows = rows.filter(o=> (o.orderNumber||"").toLowerCase().includes(search));
  if(state.readyFilter.readyWerkstatt) rows = rows.filter(o=>!!o.readyWerkstatt);
  if(state.readyFilter.readyMontage) rows = rows.filter(o=>!!o.readyMontage);
  var f = state.tableSort.field, dir = state.tableSort.dir === "asc" ? 1 : -1;
  rows.sort((a,b)=>{
    var av = (a[f]||"").toString(), bv = (b[f]||"").toString();
    if(av === bv) return 0;
    if(av === "") return 1;
    if(bv === "") return -1;
    var an = Number(av), bn = Number(bv);
    if(!isNaN(an) && !isNaN(bn)) return an < bn ? -1*dir : 1*dir;
    return av.toLowerCase() < bv.toLowerCase() ? -1*dir : 1*dir;
  });
  document.querySelectorAll("#overview-table thead th[data-sort]").forEach(th=>{
    th.classList.toggle("sorted", th.dataset.sort === state.tableSort.field);
    th.classList.toggle("desc", th.dataset.sort === state.tableSort.field && state.tableSort.dir === "desc");
  });
  var tbody = $("#overview-tbody");
  if(rows.length===0){ tbody.innerHTML = '<tr class="ov-empty-row"><td colspan="9">Keine Aufträge in dieser Ansicht.</td></tr>'; return; }
  var html = "";
  rows.forEach(o=>{
    var mats = orderMaterials(o);
    var matHtml = mats.length===0 ? '<span style="color:#c3ccd1;">–</span>' : mats.map(m=>{
      var isOk = m.status==="geliefert";
      var line = isOk ? "geliefert" : (m.expectedDate ? "ab " + fmtShort(m.expectedDate) : "ausstehend");
      return '<div class="ov-mat-line' + (isOk?"":" warn-text") + '"><span class="mdot ' + (isOk?"ok":"warn") + '"></span>' + escapeHtml(m.name) + " · " + line + "</div>";
    }).join("");
    html += '<tr class="' + (o.completed?"row-completed":"") + '" data-id="' + o.id + '">';
    html += '<td data-label="Auftrag" class="ov-orderno">' + escapeHtml(o.orderNumber) + '</td>';
    html += '<td data-label="Kunde"><div class="ov-customer">' + escapeHtml(o.customer) + '</div>' + (o.description?'<div class="ov-desc">' + escapeHtml(o.description) + '</div>':'') + '</td>';
    html += '<td data-label="Werkstatt"><span class="tag ' + (o.workshop==="aluminium"?"tag-aluminium":(o.workshop==="reparaturen"?"tag-reparaturen":"")) + '">' + workshopLabel(o.workshop) + '</span></td>';
    html += '<td data-label="Material">' + matHtml + '</td>';
    html += '<td data-label="Start">' + (o.productionStart ? fmtShort(o.productionStart) : '<span style="color:#c3ccd1;">–</span>') + '</td>';
    html += '<td data-label="Montage">' + (o.assemblyDate ? fmtShort(o.assemblyDate) : '<span style="color:#c3ccd1;">–</span>') + '</td>';
    html += '<td data-label="Werkstatt bereit"><span class="ov-ready-icon ' + (o.readyWerkstatt?"yes":"no") + '">' + (o.readyWerkstatt?"✓":"–") + '</span></td>';
    html += '<td data-label="Montage bereit"><span class="ov-ready-icon ' + (o.readyMontage?"yes":"no") + '">' + (o.readyMontage?"✓":"–") + '</span></td>';
    html += '<td data-label="Status">' + (o.completed ? "Erledigt" : "Offen") + '</td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

$("#materials-list").addEventListener("click", e=>{

$("#materials-list").addEventListener("change", async e=>{

    }else{
      toast("Kein Liefertermin im PDF gefunden — bitte manuell eintragen.");
    }
  }catch(err){

    toast("PDF-Lesefehler: " + (err && err.message ? err.message : err));

    e.target.value = "";

  if(e.target.classList.contains("mat-name")) state.modalMaterials[idx].name = e.target.value;
  if(e.target.classList.contains("mat-date")){
    state.modalMaterials[idx].expectedDate = e.target.value;
  }
});
$("#materials-list").addEventListener("change", e=>{
  var row = e.target.closest(".material-row"); if(!row) return;
  var idx = Number(row.dataset.idx); if(!state.modalMaterials[idx]) return;
  if(e.target.classList.contains("mat-status")) state.modalMaterials[idx].status = e.target.value;
});

function renderTodoRows(){
  var list = $("#todos-list");
  if(state.modalTodos.length===0){ list.innerHTML = '<div class="todos-empty">Noch kein To-Do erfasst.</div>'; return; }
  var html = "";
  state.modalTodos.forEach((t,i)=>{
    html += '<div class="todo-row" data-idx="' + i + '">' +
      '<input type="checkbox" class="todo-done"' + (t.done?" checked":"") + '>' +
      '<input type="text" class="todo-text' + (t.done?" done":"") + '" placeholder="z. B. Masse vor Ort prüfen" value="' + escapeHtml(t.text) + '">' +
      '<span class="todo-date-wrap"><input type="text" class="todo-date-display date-input" readonly placeholder="TT.MM.JJJJ" value="' + (t.dueDate ? isoToDisplay(t.dueDate) : "") + '"><input type="hidden" class="todo-date" value="' + (t.dueDate||"") + '"></span>' +
      '<button type="button" class="todo-remove" aria-label="To-Do entfernen">✕</button></div>';
  });
  list.innerHTML = html;
}
$("#add-todo-btn").addEventListener("click", ()=>{ state.modalTodos.push({text:"",done:false,dueDate:""}); renderTodoRows(); });
$("#todos-list").addEventListener("click", e=>{
  var btn = e.target.closest(".todo-remove"); if(!btn) return;
  var idx = Number(btn.closest(".todo-row").dataset.idx);
  state.modalTodos.splice(idx,1); renderTodoRows();
});
$("#todos-list").addEventListener("input", e=>{
  var row = e.target.closest(".todo-row"); if(!row) return;
  var idx = Number(row.dataset.idx); if(!state.modalTodos[idx]) return;
  if(e.target.classList.contains("todo-text")) state.modalTodos[idx].text = e.target.value;
  if(e.target.classList.contains("todo-date")) state.modalTodos[idx].dueDate = e.target.value;
});
$("#todos-list").addEventListener("change", e=>{
  var row = e.target.closest(".todo-row"); if(!row) return;
  var idx = Number(row.dataset.idx); if(!state.modalTodos[idx]) return;
  if(e.target.classList.contains("todo-done")){
    state.modalTodos[idx].done = e.target.checked;
    e.target.nextElementSibling.classList.toggle("done", e.target.checked);
  }
});

/* ---------- Modal ---------- */

var backdrop = $("#modal-backdrop");
var form = $("#order-form");

function openModal(order, prefillDate){
  state.editingId = order ? order.id : null;
  $("#modal-title").textContent = order ? "Auftrag bearbeiten" : "Neuer Auftrag";
  $("#f-orderNumber").value = order ? order.orderNumber : "";
  $("#f-customer").value = order ? order.customer : "";
  $("#f-description").value = order ? (order.description||"") : "";
  $("#f-workshop").value = order ? order.workshop : "stahl";
  $("#f-readyWerkstatt").checked = order ? !!order.readyWerkstatt : false;
  $("#f-readyMontage").checked = order ? !!order.readyMontage : false;
  $("#f-completed").checked = order ? !!order.completed : false;
  $("#f-productionStart").value = order ? (order.productionStart||"") : (prefillDate || "");
  $("#f-assemblyDate").value = order ? (order.assemblyDate||"") : "";
  $("#f-productionStart-display").value = isoToDisplay($("#f-productionStart").value);
  $("#f-assemblyDate-display").value = isoToDisplay($("#f-assemblyDate").value);
  updateWeekHint("#f-productionStart", "#f-productionStart-week");
  updateWeekHint("#f-assemblyDate", "#f-assemblyDate-week");
  state.modalMaterials = order ? JSON.parse(JSON.stringify(orderMaterials(order))) : [{name:"",status:"ausstehend",expectedDate:""}];
  renderMaterialRows();
  state.modalTodos = order ? JSON.parse(JSON.stringify(orderTodos(order))) : [];
  renderTodoRows();
  $("#delete-btn").style.display = order ? "inline-block" : "none";
  backdrop.classList.add("open");
  setTimeout(()=>$("#f-orderNumber").focus(), 30);
}
function closeModal(){ backdrop.classList.remove("open"); state.editingId = null; }

$("#add-btn").addEventListener("click", ()=>openModal(null,null));
$("#f-productionStart").addEventListener("input", ()=>updateWeekHint("#f-productionStart","#f-productionStart-week"));
$("#f-assemblyDate").addEventListener("input", ()=>updateWeekHint("#f-assemblyDate","#f-assemblyDate-week"));
$("#cancel-btn").addEventListener("click", closeModal);
backdrop.addEventListener("click", e=>{ if(e.target===backdrop) closeModal(); });

form.addEventListener("submit", async e=>{
  e.preventDefault();
  var orderNumber = $("#f-orderNumber").value.trim();
  var customer = $("#f-customer").value.trim();
  if(!orderNumber || !customer) return;
  var materials = state.modalMaterials
    .map(m=>({ name:(m.name||"").trim(), status:m.status, expectedDate:m.expectedDate||"" }))
    .filter(m=>m.name.length>0);
  var todos = state.modalTodos
    .map(t=>({ text:(t.text||"").trim(), done: !!t.done, dueDate: t.dueDate||"" }))
    .filter(t=>t.text.length>0);
  var payload = {
    orderNumber, customer,
    description: $("#f-description").value.trim(),
    workshop: $("#f-workshop").value,
    readyWerkstatt: $("#f-readyWerkstatt").checked,
    readyMontage: $("#f-readyMontage").checked,
    completed: $("#f-completed").checked,
    productionStart: $("#f-productionStart").value,
    assemblyDate: $("#f-assemblyDate").value,
    materials,
    todos,
    updatedAt: Date.now()
  };
  var submitBtn = form.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  try{
    if(state.editingId){
      await updateDoc(doc(db, COLLECTION, state.editingId), payload);
    }else{
      payload.createdAt = Date.now();
      await addDoc(collection(db, COLLECTION), payload);
    }
    closeModal();
    toast("Gespeichert.");
  }catch(err){
    console.error(err);
    toast("Speichern fehlgeschlagen — Verbindung prüfen.");
  }finally{
    submitBtn.disabled = false;
  }
});

$("#delete-btn").addEventListener("click", async ()=>{
  if(!state.editingId) return;
  try{
    await deleteDoc(doc(db, COLLECTION, state.editingId));
    closeModal();
    toast("Auftrag gelöscht.");
  }catch(err){
    console.error(err);
    toast("Löschen fehlgeschlagen.");
  }
});

/* ---------- Event delegation ---------- */

$("#view-seg").addEventListener("click", e=>{ var b=e.target.closest("button[data-view]"); if(!b) return; state.view=b.dataset.view; render(); });
$("#filter-chips").addEventListener("click", e=>{ var b=e.target.closest("button[data-filter]"); if(!b) return; state.filter=b.dataset.filter; render(); });
$("#nav-prev").addEventListener("click", ()=>navigate(-1));
$("#nav-next").addEventListener("click", ()=>navigate(1));
$("#nav-today").addEventListener("click", ()=>{ state.refDate = todayISO(); render(); });
function navigate(dir){
  var d = fromISO(state.refDate);
  if(state.view==="week") d.setDate(d.getDate()+dir*7); else d.setMonth(d.getMonth()+dir);
  state.refDate = toISO(d); render();
}
$("#calendar").addEventListener("click", e=>{
  var todoLine = e.target.closest(".card-todo-line");
  if(todoLine){ toggleCardTodo(todoLine.dataset.orderId, Number(todoLine.dataset.todoIdx)); return; }
  var toggle = e.target.closest(".card-done-toggle");
  if(toggle){ toggleCompleted(toggle.dataset.id, toggle.checked); return; }
  var addBtn = e.target.closest("[data-date]"); if(addBtn){ openModal(null, addBtn.dataset.date); return; }
  var dayNum = e.target.closest("[data-add-date]"); if(dayNum && !e.target.closest(".chip")){ openModal(null, dayNum.dataset.addDate); return; }
  var card = e.target.closest("[data-id]");
  if(card){ var o = state.orders.find(x=>x.id===card.dataset.id); if(o) openModal(o,null); }
});
async function toggleCardTodo(orderId, idx){
  var o = state.orders.find(x=>x.id===orderId);
  if(!o) return;
  var todos = orderTodos(o).map((t,i)=> i===idx ? Object.assign({}, t, { done: !t.done }) : t);
  try{ await updateDoc(doc(db, COLLECTION, orderId), { todos: todos }); }
  catch(err){ console.error(err); toast("Aktualisieren fehlgeschlagen."); }
}
async function toggleCompleted(id, done){
  try{ await updateDoc(doc(db, COLLECTION, id), { completed: done }); }
  catch(err){ console.error(err); toast("Aktualisieren fehlgeschlagen."); }
}
$("#pending-list").addEventListener("click", e=>{
  var item = e.target.closest("[data-id]"); if(!item) return;
  var o = state.orders.find(x=>x.id===item.dataset.id); if(o) openModal(o,null);
});
$("#ready-list").addEventListener("click", e=>{
  var item = e.target.closest("[data-id]"); if(!item) return;
  var o = state.orders.find(x=>x.id===item.dataset.id); if(o) openModal(o,null);
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && backdrop.classList.contains("open")) closeModal(); });

function setStatus(msg){ $("#status-line").textContent = msg; }
function toast(msg){
  var el = $("#toast"); el.textContent = msg; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 1800);
}

/* ---------- Custom-Datumsauswahl mit Kalenderwochen ---------- */

var calPopup = null;
var calState = { hiddenInput: null, displayInput: null, viewYear: 0, viewMonth: 0 };

function buildCalendarPopup(){
  calPopup = document.createElement("div");
  calPopup.id = "calendar-popup";
  document.body.appendChild(calPopup);
  calPopup.addEventListener("click", e=>{
    e.stopPropagation();
    var nav = e.target.closest("[data-cal-nav]");
    if(nav){
      var dir = Number(nav.dataset.calNav);
      calState.viewMonth += dir;
      if(calState.viewMonth < 0){ calState.viewMonth = 11; calState.viewYear--; }
      if(calState.viewMonth > 11){ calState.viewMonth = 0; calState.viewYear++; }
      renderCalendarPopup();
      return;
    }
    var dayBtn = e.target.closest("[data-cal-day]");
    if(dayBtn){ setDateValue(dayBtn.dataset.calDay); closeCalendarPopup(); return; }
    if(e.target.closest("[data-cal-today]")){ setDateValue(todayISO()); closeCalendarPopup(); return; }
    if(e.target.closest("[data-cal-clear]")){ setDateValue(""); closeCalendarPopup(); return; }
  });
  document.addEventListener("click", e=>{
    if(e.target.closest(".date-input")) return;
    if(calPopup.style.display === "block" && !calPopup.contains(e.target)) closeCalendarPopup();
  });
  document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeCalendarPopup(); });
  document.addEventListener("click", e=>{
    var trigger = e.target.closest(".date-input");
    if(trigger) openCalendarPopup(trigger);
  });
}

function openCalendarPopup(displayInput){
  var hidden = displayInput.nextElementSibling;
  if(!hidden) return;
  calState.hiddenInput = hidden;
  calState.displayInput = displayInput;
  var base = hidden.value ? fromISO(hidden.value) : new Date();
  calState.viewYear = base.getFullYear();
  calState.viewMonth = base.getMonth();
  renderCalendarPopup();
  positionCalendarPopup(displayInput);
  calPopup.style.display = "block";
}
function closeCalendarPopup(){ if(calPopup) calPopup.style.display = "none"; }

function positionCalendarPopup(displayInput){
  var rect = displayInput.getBoundingClientRect();
  var w = 260;
  var left = Math.min(Math.max(8, rect.left), window.innerWidth - w - 8);
  calPopup.style.width = w + "px";
  calPopup.style.left = left + "px";
  calPopup.style.top = (rect.bottom + 6) + "px";
  requestAnimationFrame(()=>{
    var h = calPopup.offsetHeight;
    if(rect.bottom + 6 + h > window.innerHeight - 8){
      calPopup.style.top = Math.max(8, rect.top - h - 6) + "px";
    }
  });
}

function renderCalendarPopup(){
  var grid = getMonthGrid(toISO(new Date(calState.viewYear, calState.viewMonth, 1)));
  var monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  var selectedIso = calState.hiddenInput.value;
  var todayIso = todayISO();
  var html = '<div class="cal-pop-head"><button type="button" data-cal-nav="-1">‹</button><span>' + monthNames[calState.viewMonth] + " " + calState.viewYear + '</span><button type="button" data-cal-nav="1">›</button></div>';
  html += '<div class="cal-pop-grid"><div class="cal-wk">KW</div><div class="cal-dh">Mo</div><div class="cal-dh">Di</div><div class="cal-dh">Mi</div><div class="cal-dh">Do</div><div class="cal-dh">Fr</div><div class="cal-dh">Sa</div><div class="cal-dh">So</div>';
  for(var r=0;r<6;r++){
    var rowDays = grid.days.slice(r*7, r*7+7);
    html += '<div class="cal-wk">' + isoWeek(toISO(rowDays[0])) + "</div>";
    rowDays.forEach(d=>{
      var iso = toISO(d);
      var out = d.getMonth() !== calState.viewMonth;
      var cls = "cal-day" + (out?" out":"") + (iso===todayIso?" today":"") + (iso===selectedIso?" selected":"");
      html += '<button type="button" class="' + cls + '" data-cal-day="' + iso + '">' + d.getDate() + "</button>";
    });
  }
  html += "</div>";
  html += '<div class="cal-pop-foot"><button type="button" data-cal-today="1">Heute</button><button type="button" data-cal-clear="1">Leeren</button></div>';
  calPopup.innerHTML = html;
}

function setDateValue(iso){
  calState.hiddenInput.value = iso;
  calState.displayInput.value = isoToDisplay(iso);
  calState.hiddenInput.dispatchEvent(new Event("input", { bubbles: true }));
  calState.hiddenInput.dispatchEvent(new Event("change", { bubbles: true }));
}

buildCalendarPopup();
render();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW-Registrierung fehlgeschlagen:', err));
  });
}
</script>
